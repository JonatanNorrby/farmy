<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eaf2e4">
  <meta name="description" content="A tiny, cozy isometric 3D farming game. Grow, water and harvest your own little garden.">
  <title>Farmy — A Little Place to Grow</title>
  <link rel="preconnect" href="https://cdn.babylonjs.com">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <canvas id="game" aria-label="Interactive 3D farm. WASD moves the camera; drag to pan; right-drag pans while painting; mouse wheel zooms."></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <header class="topbar">
      <div class="identity">
        <div class="brand-mark" aria-hidden="true">✿</div>
        <strong class="brand">farmy<span>.</span></strong>
        <button class="reset-button" id="reset" type="button" title="Start a new garden" aria-label="Start a new garden">↺</button>
        <button class="settings-toggle" id="settings-toggle" type="button" title="Settings" aria-label="Open settings" aria-controls="settings-panel" aria-expanded="false">⚙</button>
        <button class="shop-toggle" id="shop-toggle" type="button" aria-label="Open shop" aria-controls="shop-panel" aria-expanded="false">Shop</button>
      </div>
      <div class="counters" aria-live="polite">
        <div class="counter"><span class="counter-icon">✦</span><div><small>COINS</small><strong id="coins">64</strong></div></div>
        <div class="counter"><span class="counter-icon basket">❀</span><div><small>HARVESTS</small><strong id="harvested">0</strong></div></div>
        <div class="counter harvest-counter" id="harvest-counter" aria-label="Harvest bag: 0 of 10 crops">
          <span class="counter-icon basket" aria-hidden="true">▣</span>
          <div class="bag-info"><small>HARVEST BAG</small><strong id="bag-count">0/10</strong></div>
          <button id="sell-harvest" class="sell-harvest" type="button" aria-label="Sell harvest bag" disabled>Sell</button>
        </div>
      </div>
    </header>

    <section id="settings-panel" class="settings-panel" aria-labelledby="settings-heading" hidden>
      <div class="settings-heading">
        <strong id="settings-heading">Settings</strong>
        <button id="settings-close" class="settings-close" type="button" aria-label="Close settings">×</button>
      </div>
      <label class="brightness-label" for="brightness">
        <span>Brightness</span>
        <output id="brightness-value" for="brightness">100%</output>
      </label>
      <input id="brightness" class="brightness-slider" type="range" min="50" max="150" step="5" value="100" aria-label="Scene brightness">
      <div class="settings-footer"><span>50%</span><button id="brightness-reset" type="button">Reset</button><span>150%</span></div>
      <p class="settings-help">WASD to move · Drag to pan · Right-drag when painting · Scroll to zoom</p>
    </section>

    <section id="shop-panel" class="shop-panel" aria-labelledby="shop-heading" hidden>
      <div class="shop-heading">
        <strong id="shop-heading">Farm shop</strong>
        <span id="shop-coins" class="shop-coins" aria-live="polite">✦ 64</span>
        <button id="shop-close" class="shop-close" type="button" aria-label="Close shop">×</button>
      </div>
      <div class="shop-tabs" role="tablist" aria-label="Shop categories">
        <button id="shop-tab-seeds" type="button" role="tab" aria-controls="shop-seeds" aria-selected="true" tabindex="0" data-shop-tab="seeds">Seeds</button>
        <button id="shop-tab-buildings" type="button" role="tab" aria-controls="shop-buildings" aria-selected="false" tabindex="-1" data-shop-tab="buildings">Buildings</button>
      </div>
      <div id="shop-seeds" class="shop-content" role="tabpanel" aria-labelledby="shop-tab-seeds" data-shop-panel="seeds">
        <div class="shop-item">
          <span class="shop-icon" aria-hidden="true">🌾</span>
          <div class="shop-item-text"><strong>Wheat seed bag</strong><small>10 seeds per bag · In stock: <span id="stock-wheat">0</span></small></div>
          <button class="shop-buy" type="button" data-buy="wheat" aria-label="Buy a bag of 10 wheat seeds for 30 coins">Buy ✦ 30</button>
        </div>
      </div>
      <div id="shop-buildings" class="shop-content" role="tabpanel" aria-labelledby="shop-tab-buildings" data-shop-panel="buildings" hidden>
        <div class="shop-item">
          <span class="shop-icon" aria-hidden="true">💦</span>
          <div class="shop-item-text"><strong>Sprinkler</strong><small>Place on empty soil · In stock: <span id="stock-sprinkler">0</span></small></div>
          <button class="shop-buy" type="button" data-buy="sprinkler" aria-label="Buy one sprinkler for 36 coins">Buy ✦ 36</button>
        </div>
      </div>
    </section>

    <aside id="inspector" class="inspector" aria-label="Selected plot and expansion">
      <div id="plot-detail" class="plot-detail" hidden>
        <div id="inspect-title" class="inspect-title"></div>
        <p id="inspect-text"></p>
        <div class="progress-track"><div id="inspect-progress" class="progress-fill"></div></div>
      </div>
      <button id="expand-farm" class="expand-button" type="button" aria-label="Expand your farm land">↗ Expand land</button>
    </aside>

    <nav class="toolbar" aria-label="Garden tools">
      <div class="tools">
        <button class="tool selected" type="button" data-tool="wheat" aria-pressed="true" title="Click or drag on prepared soil to sow wheat">
          <span class="hotkey">1</span><span class="tool-icon wheat">🌾</span>
          <span class="tool-details"><strong>Wheat</strong></span>
          <span class="tool-cost">× 0</span>
        </button>
        <button class="tool watering" type="button" data-tool="water" aria-pressed="false">
          <span class="hotkey">2</span><span class="tool-icon water">💧</span>
          <span class="tool-details"><strong>Water</strong></span>
          <span class="tool-cost free">FREE</span>
        </button>
        <button class="tool" type="button" data-tool="sprinkler" aria-pressed="false" title="Place a purchased sprinkler to water nearby crops">
          <span class="hotkey">3</span><span class="tool-icon sprinkler">💦</span>
          <span class="tool-details"><strong>Sprinkler</strong></span>
          <span class="tool-cost">× 0</span>
        </button>
        <button class="tool" type="button" data-tool="plot" aria-pressed="false" title="Paint soil freely onto owned grass by dragging">
          <span class="hotkey">4</span><span class="tool-icon plot">🪴</span>
          <span class="tool-details"><strong>Plot</strong></span>
          <span class="tool-cost">✦ 3</span>
        </button>
      </div>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="loading" class="loading"><div class="loading-flower">✿</div><strong>Loading farm</strong><p id="loading-detail">Loading 3D scene</p></div>
  </main>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
